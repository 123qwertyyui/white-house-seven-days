<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白宫困局 · 七日总统模拟器</title><style>
:root{--navy:#172d38;--paper:#f4f1e9;--gold:#b98b48;--ink:#263a42;--line:#dcdacf;--muted:#6c7777;--green:#346a58;--red:#9d4b43}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 Georgia,'Microsoft YaHei',serif}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:var(--navy);color:#ebe9df;padding:30px 22px;display:flex;flex-direction:column}.seal{width:56px;height:56px;border:1px solid #bba378;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#d3b378}.brand{font-size:23px;letter-spacing:3px;margin-top:12px}.eyebrow{font:11px/1.6 sans-serif;letter-spacing:2px;color:var(--muted)}aside .eyebrow{color:#aab8b8}nav{margin-top:42px;display:grid;gap:8px}nav button{border:0;background:transparent;color:#c1cdce;text-align:left;padding:12px;border-radius:5px}nav button.active{background:#2c434e;color:#f2dfb9}.aside-note{margin-top:auto;padding-top:40px;color:#aebfc3;font-size:12px}main{min-width:0}header{display:flex;align-items:center;justify-content:space-between;padding:20px 36px;border-bottom:1px solid var(--line);gap:16px}.session{font-size:12px;color:var(--muted)}.tag{background:#e8decb;color:#745a30;padding:4px 10px;border-radius:3px;font-size:12px}.content{padding:30px 36px;max-width:1400px;margin:auto}h1{font-weight:400;font-size:36px;line-height:1.3;margin:6px 0 10px}h2{font-size:21px;font-weight:400;margin:0 0 14px}h3{font-weight:500;font-size:16px;margin:0 0 8px}p{margin:8px 0}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:26px}.deadline{text-align:right;color:var(--gold);font-size:38px}.deadline small{display:block;font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0 26px}.stat{border-top:2px solid var(--gold);padding:12px 16px;background:#fffdf7}.stat strong{display:block;font-weight:400;font-size:27px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:24px}.panel{background:#fffdf8;border:1px solid var(--line);padding:24px;border-radius:5px;margin-bottom:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button.action{padding:10px 16px;border:1px solid var(--line);border-radius:4px;background:#fffdf8;color:var(--ink)}button.primary{background:var(--navy);color:#fffdf8;border-color:var(--navy)}button.danger{color:var(--red)}.brief{border-left:3px solid var(--gold);padding:10px 18px;background:#f5efdf}.actor{padding:15px 0;border-bottom:1px solid var(--line)}.actor:last-child{border:0}.pill{font-size:12px;padding:3px 8px;border-radius:3px;background:#e9ece6;white-space:nowrap}.yes{color:var(--green)}.no{color:var(--red)}.track{height:6px;background:#e7e7df;margin:8px 0}.track span{display:block;background:var(--green);height:100%}.log{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.log small{color:var(--gold);margin-right:10px}.control{padding:16px 0;border-bottom:1px solid var(--line)}label{display:block}input[type=range]{width:100%;accent-color:var(--navy);margin-top:12px}select{width:100%;padding:10px;border:1px solid var(--line);background:#fffdf8;color:var(--ink);margin:8px 0}.message{padding:16px;background:#edf0eb;border-left:3px solid var(--green);margin:16px 0;white-space:pre-wrap}.timeline{border-left:1px solid var(--gold);padding-left:20px}.notice{font-size:12px;color:var(--muted);margin-top:24px}.seats{display:flex;gap:6px;flex-wrap:wrap}.seat{height:18px;flex:1;min-width:9px;background:#d8dcd9}.seat.on{background:var(--green)}a{color:var(--green)}#toast{background:var(--navy);color:#fffdf8;padding:10px 18px;display:none}details{margin-top:20px}summary{cursor:pointer}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:18px 36px}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{padding:16px 20px;display:block}.seal,.aside-note{display:none}.brand{margin:0;font-size:20px}nav{display:flex;flex-wrap:wrap;margin:12px 0 0;gap:2px}nav button{padding:8px}header{padding:16px 20px}.content{padding:22px 18px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:8px}.stat strong{font-size:22px}h1{font-size:29px}.hero{gap:8px}.deadline{font-size:28px}.panel{padding:18px}.row{flex-wrap:wrap}}
</style></head><body><div class="shell"><aside><div class="seal" aria-hidden="true">★</div><div class="brand">白宫困局</div><div class="eyebrow">THE SEVENTH DAY</div><nav aria-label="工作台"><button data-tab="desk">01　总统办公桌</button><button data-tab="talk">02　政治磋商室</button><button data-tab="policy">03　政策工作台</button><button data-tab="archive">04　决策与复盘</button></nav><div class="aside-note">虚构任期 · 教学模拟<br>你的权力有边界，<br>你的选择有后果。<br><br>规则角色引擎 · v0.1<br>尚未连接大语言模型</div></aside><main><header><div><span class="eyebrow">EXECUTIVE OFFICE</span><div>拨款期限前的七天</div></div><div class="session"><span class="tag">可玩首版</span>　自动保存至本机</div></header><div id="toast" role="status"></div><div class="content" id="app" aria-live="polite"></div><footer>独立教学作品，非美国政府官方产品。人物、席位、资金单位及行为参数均为虚构；不构成现实政治预测。</footer></main></div>
<script>
(()=>{'use strict';const app=document.getElementById('app');const initial=()=>({day:1,ap:3,tab:'desk',services:6,fiscal:5,duration:30,review:false,audit:false,commitments:{},message:'',logs:[{day:1,text:'你就任总统。拨款期限将在第七天结束。先争取信息，再决定要向谁让步。'}],done:false,result:null,history:[]});let state;try{state=JSON.parse(localStorage.getItem('president-v1'))||initial();if(!Array.isArray(state.logs)||state.day<1||state.day>7)state=initial()}catch{state=initial()}
const actors=[{id:'house',name:'艾琳·沃德',title:'众议院同党领导人',bloc:'众院党团',need:'需要财政约束，并向党团说明资金去向。',base:'我愿意推进你的方案，但同党并不等于无条件支持。'}, {id:'senate',name:'马库斯·里德',title:'参议院跨党协商代表',bloc:'参院协商组',need:'需要公共服务保障，以及可兑现的审议安排。',base:'我们需要一份能向各自阵营解释的协议。'}, {id:'fiscal',name:'丹尼尔·肖',title:'财政约束派代表',bloc:'众院关键派系',need:'要求较强财政约束、审计与较短执行期限。',base:'没有可核验的支出约束，我不会作出支持承诺。'}, {id:'public',name:'玛雅·陈',title:'公共服务派代表',bloc:'两院关键派系',need:'要求服务保障达到8，并接受定期审议。',base:'我最关心服务承诺能否在协议执行后得到保障。'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function positions(s=state){return {house:s.fiscal>=5&&s.audit,senate:s.services>=6&&s.review,fiscal:s.fiscal>=7&&s.audit&&s.duration<=30,public:s.services>=8&&s.review}}
function votes(){const p=positions();return {house:150+(p.house?55:0)+(p.fiscal?25:0)+(p.public?15:0),senate:40+(p.senate?15:0)+(p.public?7:0)+(p.fiscal?3:0)}}
function cost(){return state.services*6+(90-state.duration)/10+(state.review?2:0)+(state.audit?3:0)}function room(){return 100-state.fiscal*5}function feasible(){return cost()<=room()}function save(){try{localStorage.setItem('president-v1',JSON.stringify(state))}catch{}}function log(text){state.logs.unshift({day:state.day,text})}function spend(){if(state.done||state.ap<=0)return false;state.ap--;return true}function notify(text){const t=document.getElementById('toast');t.textContent=text;t.style.display='block';setTimeout(()=>t.style.display='none',4500)}function setTab(tab){state.tab=tab;save();render()}function status(id){return positions()[id]?'愿意支持':'尚有保留'}
function render(){save();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const v=votes();let html=`<div class="hero"><div><div class="eyebrow">CHAPTER 01 / THE FUNDING DEADLINE</div><h1>${state.done?'协议之后，责任仍在。':'总统先生，合作不会自动发生。'}</h1><p class="muted">${state.done?'查看这份协议如何形成，以及谁的诉求没有被满足。':'七天内推动一份拨款方案。每一天，只有三次关键行动。'}</p></div><div class="deadline">DAY ${state.day}<small>${state.done?'本局已结束':`今日剩余 ${state.ap} 次行动`}</small></div></div>`;
html+=`<div class="stats"><div class="stat"><span class="eyebrow">HOUSE · 模拟支持</span><strong>${v.house} / 218</strong><span class="muted">众院推进目标</span></div><div class="stat"><span class="eyebrow">SENATE · 模拟支持</span><strong>${v.senate} / 60</strong><span class="muted">参院协商目标</span></div><div class="stat"><span class="eyebrow">RESOURCE · 示意单位</span><strong>${cost().toFixed(1)} / ${room()}</strong><span class="${feasible()?'muted':'no'}">${feasible()?'方案在模拟资源范围内':'方案超出资源范围'}</span></div></div>`;
if(state.tab==='desk')html+=`<div class="grid"><section><div class="panel"><div class="row"><h2>晨间简报</h2><span class="tag">第 ${state.day} 天</span></div><div class="brief">${brief()}</div><p class="muted">先与各方会谈，了解条件，再到政策工作台修改方案。投票支持是规则估计，不是现实民调。</p><div class="buttons"><button class="action primary" data-go="talk">开始政治磋商 →</button><button class="action" data-go="policy">调整拨款方案</button></div></div><div class="panel"><h2>你不是唯一的决策者</h2>${actors.map(a=>`<div class="actor row"><div><strong>${a.name}</strong><div class="muted">${a.title}</div></div><span class="pill ${positions()[a.id]?'yes':''}">${status(a.id)}</span></div>`).join('')}</div></section><section><div class="panel"><h2>总统行动</h2><p>推进一天会补充行动次数；未用完的次数不会保留。</p><div class="buttons"><button class="action" id="next" ${state.done?'disabled':''}>结束今天 →</button><button class="action primary" id="vote" ${state.done?'disabled':''}>提交两院并签署</button></div><p class="notice">本模式将两院程序压缩为一次结算。只有两院均达到目标且资源可行，方案才会生效。提交本身占用一次行动。</p></div><div class="panel"><h2>最近决策</h2>${state.logs.slice(0,4).map(entry).join('')}</div></section></div>`;
if(state.tab==='talk')html+=`<div class="grid"><section class="panel"><h2>闭门磋商</h2><p class="muted">每次会谈消耗一次行动。回复依据角色条件生成，当前不使用外部AI。</p><label for="actor">选择会谈对象</label><select id="actor">${actors.map(a=>`<option value="${a.id}">${a.name} · ${a.title}</option>`).join('')}</select><label for="approach">你的谈判方式</label><select id="approach"><option value="listen">询问：支持方案的具体条件是什么？</option><option value="offer">征询：是否支持当前工作方案？</option><option value="promise">承诺：保留满足对方要求的当前条款</option></select><div class="buttons"><button class="action primary" id="talk" ${state.done||state.ap===0?'disabled':''}>进行会谈 · 1次行动</button></div><div class="message">${esc(state.message||'幕僚长：建议先询问条件。公开显示的支持可能随你的方案调整而变化。')}</div></section><section class="panel"><h2>已经作出的承诺</h2>${Object.keys(state.commitments).length?Object.entries(state.commitments).map(([id,c])=>`<div class="actor"><h3>${actors.find(a=>a.id===id).name}</h3><p>第${c.day}天：保留满足该方支持条件的条款。</p><span class="pill ${positions()[id]?'yes':'no'}">${positions()[id]?'当前仍满足':'当前方案已偏离承诺'}</span></div>`).join(''):'<p class="muted">尚无正式承诺。承诺不会增加票数，但会进入履约复盘。</p>'}<p class="notice">不必承诺所有诉求。每项让步都可能影响资源可行性或其他派系的支持。</p></section></div>`;
if(state.tab==='policy')html+=`<div class="grid"><section class="panel"><h2>拨款方案 · 工作版本</h2><p class="muted">先调整草案，再保存。每次保存消耗一次行动。</p><div class="control"><label for="services">公共服务保障 <strong id="sv">${state.services}</strong> / 10</label><input id="services" type="range" min="0" max="10" value="${state.services}"></div><div class="control"><label for="fiscal">财政约束强度 <strong id="fv">${state.fiscal}</strong> / 10</label><input id="fiscal" type="range" min="0" max="10" value="${state.fiscal}"></div><div class="control"><label for="duration">拨款执行期限</label><select id="duration">${[14,30,90].map(d=>`<option value="${d}" ${d===state.duration?'selected':''}>${d} 天</option>`).join('')}</select></div><div class="control"><label><input id="review" type="checkbox" ${state.review?'checked':''}> 加入定期审议条款</label><label><input id="audit" type="checkbox" ${state.audit?'checked':''}> 加入独立审计条款</label></div><div class="buttons"><button class="action primary" id="apply" ${state.done||!state.ap?'disabled':''}>保存并征询支持 · 1次行动</button></div><p id="draft-cost" class="notice"></p></section><section><div class="panel"><h2>当前已保存方案的反馈</h2>${actors.map(a=>`<div class="actor"><div class="row"><h3>${a.bloc}</h3><span class="pill ${positions()[a.id]?'yes':''}">${status(a.id)}</span></div><p class="muted">${a.need}</p></div>`).join('')}</div><details class="panel"><summary>查看模拟规则与制度简化</summary><p>本局固定虚构的435席众院和100席参院，以218与60作为剧情推进目标。60是本剧本对终结辩论及跨党支持的简化要求，不是所有参院议案的最终通过门槛。</p><p>资源成本＝服务保障×6＋(90−执行天数)/10＋审议成本2＋审计成本3；资源上限＝100−财政约束×5。全部是教学参数，并非真实预算。</p><p>同党领导层支持增加众院55席；财政派增加众院25席及参院3席；公共服务派增加众院15席及参院7席；跨党协商组增加参院15席。基础支持为众院150、参院40。各组不重叠。</p><p>不同支持条件存在取舍；本局不保证所有角色同时满意。</p></details></section></div>`;
if(state.tab==='archive')html+=`<div class="grid"><section><div class="panel"><h2>${state.done?state.result:'任期中的一页'}</h2><p>${state.done?outcome():'你的决策记录会随每次行动更新。可以在总统办公桌提交方案，或继续磋商。'}</p><p>服务保障：${state.services}/10　财政约束：${state.fiscal}/10　执行期限：${state.duration}天</p><p>支持情况：众院 ${v.house}，参院 ${v.senate}。</p><p>承诺偏离：${Object.keys(state.commitments).filter(id=>!positions()[id]).length} 项</p><div class="buttons"><button class="action" id="export">导出决策档案</button><button class="action danger" id="restart">重新开始同一情境</button></div><p class="notice">重新开始会清除本机当前进度，请先导出。相同初始条件使用相同规则，方便比较策略。</p></div><div class="panel"><h2>决策时间线</h2><div class="timeline">${state.logs.map(entry).join('')}</div></div></section><section class="panel"><h2>这局模拟能说明什么？</h2><p>观察方案如何改变联盟、资源和承诺之间的关系。它不能预测真实议员行为或政策效果。</p><h3>复盘问题</h3><p>你为赢得关键支持放弃了什么？</p><p>协议中哪些需求仍未得到满足？</p><p>如果先协商另一方，你会更早找到可行方案吗？</p><h3>制度资料</h3><p><a href="https://www.usa.gov/federal-budget-process" target="_blank" rel="noopener">联邦预算流程 · USAGov</a></p><p><a href="https://www.senate.gov/about/powers-procedures/voting.htm" target="_blank" rel="noopener">参议院表决程序 · Senate</a></p><p class="notice">作品使用生成式AI辅助开发；运行中的角色由透明规则驱动，尚未接入豆包。</p></section></div>`;
app.innerHTML=html;bind()}
function brief(){return ['','拨款谈判刚刚开始。同党领导人希望你先给出财政纪律安排，参院跨党代表则要求保护公共服务。','晨间盘点：公开支持不是最终承诺。预算工作台显示的方案变化，会立即影响各派系态度。','期限越来越近。财政约束派要求审计与短期拨款；公共服务派要求更高保障。两套要求可能挤压资源。','幕僚长提醒：争取每一个派系未必可行。识别足以推动方案的联盟，并核对已经作出的承诺。','执行部门要求明确拨款持续时间。短期方案能争取部分支持，却更快迎来下一次谈判。','距离期限只剩两天。你仍可修改方案，但提交两院也需要保留一次行动。','最后一天。请在行动次数耗尽前提交方案，否则本轮将以未能形成协议结束。'][state.day]}
function entry(l){return `<div class="log"><small>DAY ${l.day}</small>${esc(l.text)}</div>`}function outcome(){return state.result==='拨款方案生效'?'两院达到本剧本支持目标，方案在资源范围内，你已签署。协议并未满足所有主体，下一次审议仍需要继续协调。':'未在期限内形成可执行协议。本剧本假定相关拨款出现缺口；不模拟具体机构停摆、豁免或现实经济损失。'}
function finish(success){state.done=true;state.result=success?'拨款方案生效':'期限届满：未形成协议';log(state.result);state.tab='archive';render()}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));const by=id=>document.getElementById(id);if(by('next'))by('next').onclick=()=>{if(state.done)return;if(state.day===7)return finish(false);state.history.push({day:state.day,...votes(),services:state.services,fiscal:state.fiscal});state.day++;state.ap=3;log('进入新的一天。行动次数恢复为3。');render()};if(by('vote'))by('vote').onclick=()=>{if(!spend())return notify('今天没有行动次数，请推进一天。');const v=votes();if(v.house>=218&&v.senate>=60&&feasible())finish(true);else{log(`提交未获通过：众院${v.house}/218、参院${v.senate}/60；${feasible()?'资源可行':'资源超限'}。`);render();notify('方案尚不满足通过条件，可以修改后再次提交。')}};if(by('talk'))by('talk').onclick=()=>{if(!spend())return;const a=actors.find(a=>a.id===by('actor').value),method=by('approach').value;let text=a.base;if(method==='listen')text=a.need;else if(method==='offer')text=positions()[a.id]?'当前方案满足我们的主要条件，我愿意支持。若你修改关键条款，需要重新确认。':'我仍然有保留。'+a.need;else if(positions()[a.id]){state.commitments[a.id]={day:state.day};text='我记录下这项承诺。如果后续方案不再满足条件，我们将重新考虑支持。'}else text='当前方案尚不满足条件，我不能把口头保证视为已经兑现。'+a.need;state.message=a.name+'：'+text;log('与'+a.name+'会谈：'+text);render()};if(by('apply')){const draft=()=>{const services=+by('services').value,fiscal=+by('fiscal').value,duration=+by('duration').value;by('sv').textContent=services;by('fv').textContent=fiscal;const c=services*6+(90-duration)/10+(by('review').checked?2:0)+(by('audit').checked?3:0);by('draft-cost').textContent=`未保存草案资源：${c.toFixed(1)} / ${100-fiscal*5}。保存后更新右侧支持情况。`};['services','fiscal','duration','review','audit'].forEach(id=>by(id).oninput=draft);draft();by('apply').onclick=()=>{if(!spend())return;state.services=+by('services').value;state.fiscal=+by('fiscal').value;state.duration=+by('duration').value;state.review=by('review').checked;state.audit=by('audit').checked;log(`保存方案：服务${state.services}，财政约束${state.fiscal}，${state.duration}天；审议${state.review?'有':'无'}，审计${state.audit?'有':'无'}。`);render()}}if(by('restart'))by('restart').onclick=()=>{if(confirm('重新开始将清除当前本机进度，确定吗？')){state=initial();render()}};if(by('export'))by('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='白宫困局-决策档案.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));render();
})();
</script></body></html>
