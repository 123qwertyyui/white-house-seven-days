<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十三日 · 危机决策实验室</title><style>
:root{--bg:#eeeae0;--paper:#faf7ef;--ink:#23352f;--dark:#1c302b;--muted:#68736a;--line:#d5d4c7;--red:#93473b;--gold:#b4945f}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.7 Georgia,'Microsoft YaHei',serif}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}header{padding:22px 5%;background:var(--dark);color:var(--paper);display:flex;justify-content:space-between;gap:20px;align-items:center}.wordmark{font-size:26px;letter-spacing:8px}.tiny{font:11px/1.7 sans-serif;letter-spacing:2px;color:var(--muted)}header .tiny{color:#b9c6b9}.stamp{border:1px solid #9c7961;padding:5px 12px;color:#dfc4a4;font-size:12px}main{max-width:1240px;margin:auto;padding:30px 24px}nav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:26px;flex-wrap:wrap}button{padding:10px 16px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}nav button{background:transparent;border-color:transparent}nav button[aria-pressed=true]{background:var(--dark);color:var(--paper)}h1{font-size:40px;font-weight:400;line-height:1.35;margin:8px 0 12px}h2{font-size:23px;font-weight:400;margin:0 0 14px}h3{font-size:17px;font-weight:500;margin:0 0 8px}p{margin:8px 0}.muted{color:var(--muted)}.headline{display:flex;justify-content:space-between;gap:25px;align-items:center}.counter{font-size:38px;color:var(--red);white-space:nowrap}.counter small{font-size:12px;display:block;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px}.panel{background:var(--paper);padding:24px;border:1px solid var(--line);margin:20px 0}.document{border-top:3px solid var(--gold)}.label{display:inline-block;font-size:12px;padding:3px 9px;background:#e8e4d6;color:#6e5a37}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.fact{border-top:1px solid var(--gold);padding-top:12px}.fact strong{display:block;font-size:20px;font-weight:400}.primary{background:var(--dark);color:var(--paper);border-color:var(--dark)}.choices{display:grid;gap:10px}.choice{text-align:left;padding:16px}.choice strong{display:block;font-weight:500}.choice span{display:block;color:var(--muted);font-size:13px}.choice:hover{border-color:var(--gold);background:#f0ebdc}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.quote{border-left:3px solid var(--gold);padding:14px 18px;background:#edeadd;margin:16px 0;white-space:pre-wrap}.log{border-bottom:1px solid var(--line);padding:15px 0}.log small{display:block;color:var(--red)}.red{color:var(--red)}a{color:#39634d}details{margin:16px 0}summary{cursor:pointer}footer{padding:20px 5%;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.progress{display:flex;gap:5px;margin:18px 0}.progress span{height:5px;background:#d4d7ce;flex:1}.progress .on{background:var(--red)}select{display:block;width:100%;margin:12px 0;padding:10px;background:var(--paper);border:1px solid var(--line)}#status{color:var(--red)}@media(max-width:740px){header{padding:16px 20px}.stamp{display:none}main{padding:20px 16px}h1{font-size:29px}.grid{grid-template-columns:1fr;gap:0}.panel{padding:18px}.facts{gap:8px}.fact strong{font-size:16px}.counter{font-size:27px}}
</style></head><body><header><div><div class="wordmark">十三日</div><div class="tiny">THIRTEEN DAYS / DECISION LAB</div></div><div class="stamp">教学模拟 · 规则驱动首版 0.1</div></header><main><nav aria-label="主导航"><button data-tab="room">危机决策室</button><button data-tab="council">顾问会议</button><button data-tab="record">行动档案</button><button data-tab="sources">史料与规则</button></nav><div id="app" aria-live="polite"></div></main><footer>独立教学作品 · AI辅助开发。运行时未调用大语言模型。所有顾问对白为设计重构；反事实结果不代表历史预测或真实战争概率。</footer><script>
(()=>{'use strict';const store='cuba-v1';const fresh=()=>({step:0,tab:'room',pressure:0,channel:0,clarity:0,restraint:0,publicDemand:false,logs:[],pending:null,done:false,ending:'',advice:'',dialogue:[]});let s;try{s=JSON.parse(localStorage.getItem(store))||fresh();if(!Number.isInteger(s.step)||s.step<0||s.step>5||!Array.isArray(s.logs))s=fresh()}catch{s=fresh()}const app=document.getElementById('app');const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=[
{title:'情报送进了白宫。',tag:'起点 / 1962年10月16日',brief:'你收到关于古巴导弹设施的情报简报。你需要决定如何组织评估，以及是否立即对外表态。首版以这一历史背景开始，后续六个决策节点均为压缩的教学重构。',choices:[['扩大交叉核实','请情报与外交顾问分别评估证据，暂不公开结论。',{clarity:2,restraint:1},'多方意见进入决策记录。核实提供了更多解释，但也消耗了一个决策窗口。'],['先作强硬公开声明','在信息尚不完整时向外界明确立场。',{pressure:2,publicDemand:true},'公开承诺形成。你的后续谈判必须考虑此前表态带来的约束。'],['召开内部方案会议','把外交施压、隔离与军事行动作为政策选项讨论。',{clarity:1,restraint:1},'内部讨论保留了多条政策路径；你仍没有得到对手的直接回应。']]},
{title:'行动，也是一种信号。',tag:'节点二 / 政策选择',brief:'顾问对如何施加压力存在分歧。你要确定一条政策方向；首版不模拟具体战术、目标或武器运用。',choices:[['有限海上隔离＋沟通说明','以有限措施施压，同时说明范围和后续沟通意愿。',{pressure:1,channel:1,restraint:1},'有限施压仍可能被对手视为威胁，但沟通渠道保留下来。'],['外交交涉优先','先提出交涉与核验要求，暂缓新的军事施压。',{channel:2,restraint:1},'出现继续磋商的空间，但对方是否让步仍未确定。'],['选择高强度军事施压','接受更高的升级风险，要求对方立即响应。',{pressure:3},'双方行动余地受到压缩。军事执行与政治沟通需要额外协调。']]},
{title:'对手听见了什么？',tag:'节点三 / 沟通与误判',brief:'模拟分支：你收到一份措辞含糊的对方回应。它可能表示愿意谈判，也可能旨在争取时间。你不能直接看到对方的真实底线。',choices:[['通过秘密渠道澄清','区分公开立场和可以讨论的条件。',{channel:2,clarity:1},'对方回应：可以继续讨论安全保证，但公开措辞不能代替具体安排。此对白为规则重构。'],['公开重申最后通牒','用更明确的公开要求压缩不确定性。',{pressure:2,publicDemand:true},'措辞更加明确，同时公开退让的空间缩小。'],['请第三方传递核验建议','寻求间接澄清，为直接沟通保留距离。',{channel:1,clarity:1,restraint:1},'第三方传回原则性回应，仍需要确认其授权和具体含义。']]},
{title:'一份未经确认的警报。',tag:'节点四 / 授权边界',brief:'模拟分支：执行机构报告一起尚未核实的接触事件。它不是对1962年某一具体事件的复刻；你要决定在核实期间如何约束行动。',choices:[['先核实，重大升级须再请示','保留防护措施，并把升级行动收回政治层面确认。',{clarity:2,restraint:2},'后续报告仍不完整，但立即升级被暂缓。你保留了再次评估的机会。'],['授权执行部门自行回应','缩短反应时间，也接受更大的行动偏离风险。',{pressure:3,restraint:-1},'执行部门获得更大裁量空间，政治决策与现场行动的距离扩大。'],['立即向对方确认接触情况','在核实本方报告的同时，尝试排除意外。',{channel:1,clarity:1,restraint:1},'双方获得澄清机会；消息送达并不保证对方接受本方解释。']]},
{title:'协议需要留出什么空间？',tag:'节点五 / 谈判条件',brief:'模拟分支：你可以讨论撤除相关部署、安全保证与核验安排。首版只处理原则性条件，不虚构已经获准的真实协议文本。',choices:[['提出有核验的相互保证','把撤除安排、避免入侵承诺与落实核验放进谈判。',{channel:2,restraint:1},'谈判开始处理双方安全关切，是否落实仍取决于执行与核验。'],['讨论公开安排与秘密谅解','承认两类渠道的知情范围不同，并记录其监督困难。',{channel:2,clarity:1},'协议空间扩大，同时秘密承诺的授权与后续落实需要单独核验。'],['坚持公开单方面退让','要求对手公开接受本方全部要求，不提供新的保证。',{pressure:3,channel:-1},'公开压力进一步上升，对方接受条件的空间可能收缩。']]},
{title:'签字之前，先问如何执行。',tag:'节点六 / 执行与收束',brief:'最后一个模拟决策节点。总统的声明不是危机自动结束的按钮。你需要选择执行原则，然后查看本局的规则结算。',choices:[['分阶段实施，并核实履约','将行动与核验对应，遇到不一致时重新沟通。',{clarity:2,restraint:1},'执行安排加入核验节点，保留处理争议的程序。'],['保留压力直至获得确认','要求明确确认，同时维持已有施压。',{pressure:1,clarity:1},'确认要求更明确，但执行期间的接触风险仍需要管理。'],['仅凭公开声明宣布成功','省略后续确认，立即结束本局决策。',{clarity:-2},'公开宣布成功，但声明不能证实对方已经履约。']]}
];
const clamp=x=>Math.max(0,x);const risk=()=>s.pressure>=8?'升级压力突出':s.pressure>=4?'对抗压力累积':'仍有协调空间';const comm=()=>s.channel>=5?'多条渠道可用':s.channel>=2?'渠道有限':'缺少直接澄清';const knowledge=()=>s.clarity>=5?'交叉核实较充分':s.clarity>=2?'部分信息已核实':'关键判断仍待核实';function save(){try{localStorage.setItem(store,JSON.stringify(s))}catch{}}function nav(t){s.tab=t;render()}function end(){s.done=true;s.ending=s.pressure>=9&&s.restraint<5?'升级失控的危险突出':s.channel>=5&&s.clarity>=5&&s.restraint>=4?'形成可继续落实的降级安排':s.channel>=3?'暂时缓和，履约仍待确认':'陷入僵局，危机尚未解决'}function act(i){if(s.done||s.pending!==null)return;const c=stages[s.step].choices[i];s.pending={choice:c[0],result:c[3]};Object.entries(c[2]).forEach(([k,v])=>{s[k]=typeof v==='boolean'?v:clamp(s[k]+v)});s.logs.push({node:s.step+1,title:stages[s.step].title,choice:c[0],result:c[3],state:{pressure:s.pressure,channel:s.channel,clarity:s.clarity,restraint:s.restraint}});render()}function next(){if(!s.pending)return;s.pending=null;if(s.step===5){end();s.tab='record'}else s.step++;render()}
function render(){save();document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===s.tab)));const d=stages[s.step];let h=`<div class="headline"><div><div class="tiny">CUBAN MISSILE CRISIS / ${s.done?'AFTER ACTION REVIEW':'PRESIDENTIAL BRIEF'}</div><h1>${s.done?'你改变了路径，未必消除了风险。':d.title}</h1><p class="muted">有限信息 · 多主体决策 · 升级控制</p></div><div class="counter">${s.step+1} / 6<small>${s.done?'本局结束':'关键决策节点'}</small></div></div><div class="progress" aria-label="完成进度">${stages.map((_,i)=>`<span class="${i<=s.step?'on':''}"></span>`).join('')}</div><div class="facts"><div class="fact"><span class="tiny">局势判断 / 模拟</span><strong>${risk()}</strong></div><div class="fact"><span class="tiny">沟通状态 / 模拟</span><strong>${comm()}</strong></div><div class="fact"><span class="tiny">信息质量 / 模拟</span><strong>${knowledge()}</strong></div></div>`;
if(s.tab==='room')h+=`<div class="grid"><section><div class="panel document"><span class="label">${d.tag}</span><h2 style="margin-top:14px">本轮简报</h2><p>${d.brief}</p><p class="muted">${s.step===0?'历史背景以图书馆和档案资料为依据；顾问对白为模拟重构。':'以下局势是你已经作出选择后的教学模拟，不是历史记载。'}</p></div><h2>你的决定</h2>${s.done?'<p>本局已结束，请查看复盘或重新开始。</p>':s.pending?`<div class="panel"><h3>已选择：${s.pending.choice}</h3><p>${s.pending.result}</p><div class="buttons"><button class="primary" id="next">${s.step===5?'完成本局并复盘':'进入下一决策节点 →'}</button></div></div>`:`<div class="choices">${d.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><strong>${c[0]}</strong><span>${c[1]}</span></button>`).join('')}</div>`}</section><section><div class="panel"><h2>决策前，听不同意见</h2><p>外交、情报与安全顾问分别关注不同问题。建议不等于事实，也不替你决定。</p><button id="to-council">进入顾问会议 →</button></div><div class="panel"><h3>他方不是同一个声音</h3><p><strong>苏联：</strong>安全、战略地位与承诺可信度。</p><p><strong>古巴：</strong>自身安全及参与决定的空间。</p><p><strong>执行机构：</strong>在命令、既有程序与不完整报告间行动。</p><p class="muted">这些是首版的角色建模维度，并非对历史人物全部动机的定论。</p></div></section></div>`;
if(s.tab==='council')h+=`<div class="grid"><section class="panel"><h2>白宫内部讨论</h2><span class="label">重构对白 · 非历史引文</span><label for="advisor">选择顾问视角</label><select id="advisor"><option value="diplomacy">外交顾问</option><option value="intel">情报顾问</option><option value="security">安全顾问</option><option value="cuba">古巴视角提示</option></select><button class="primary" id="consult">听取本轮意见</button><div class="quote">${esc(s.advice||'选择一个视角，听取与当前局势对应的建议。咨询不会消耗决策节点。')}</div><button id="back-room">返回决策室</button></section><section class="panel"><h2>知情边界</h2><p>你看到的是送达总统的简报，不是对手的真实底线。</p><p>本首版使用受限的预设建议，不读取模型的历史知识。</p><p>后续AI版需要按角色与时间过滤资料，避免模型提前知道历史结局。</p><p class="red">这一版没有真实多智能体自主谈判；你看到的是可审查的教学规则。</p></section></div>`;
if(s.tab==='record')h+=`<div class="grid"><section><div class="panel"><h2>${s.done?s.ending:'本局仍在进行'}</h2><p>${s.done?'结局由本页公开规则计算，不是对现实战争或外交结果的预测。':'完成六个节点后查看结局。现在可以检查已经作出的决定。'}</p>${s.publicDemand?'<p>你曾作出强硬公开表态。首版只记录这一约束，尚未模拟国内受众反应。</p>':''}<div class="buttons"><button id="resume">返回决策</button><button id="export">导出记录</button><button id="reset">重新开始</button></div></div><h2>决策时间线</h2>${s.logs.length?s.logs.map(l=>`<div class="log"><small>节点 ${l.node}</small><h3>${l.choice}</h3><p>${l.result}</p></div>`).join(''):'<p class="muted">尚未作出决策。</p>'}</section><section><div class="panel"><h2>复盘问题</h2><p>你在哪一步获得了新的信息？</p><p>哪些行动保留或压缩了谈判空间？</p><p>是否把对方的表态误当成已经履约？</p><p>古巴的安全关切有没有被考虑？</p></div><div class="panel"><h2>与真实历史比较</h2><p>历史危机在10月28日进入关键缓解节点，但危机收束涉及公开安排与秘密沟通，不能简化为某一个按钮的胜利。</p><p>本版只将历史作为起点；模拟后续不应当被当作1962年的真实事件。</p><a href="https://history.state.gov/milestones/1961-1968/cuban-missile-crisis" target="_blank" rel="noopener">查看历史概述与限制 →</a></div></section></div>`;
if(s.tab==='sources')h+=`<div class="grid"><section class="panel"><h2>事实、假设与生成内容</h2><p><strong>史实起点：</strong>1962年10月16日，总统获悉古巴导弹设施相关情报。10月16日至28日是本作品关注的关键时期。</p><p><strong>教学重构：</strong>六个节点、全部对白、事件顺序和结局门槛。</p><p><strong>不模拟：</strong>具体军事作战、真实伤亡数、核战争概率或精确经济后果。</p><h3>可核查资料</h3><p><a href="https://microsites.jfklibrary.org/cmc/" target="_blank" rel="noopener">肯尼迪图书馆：十三日档案</a></p><p><a href="https://history.state.gov/milestones/1961-1968/cuban-missile-crisis" target="_blank" rel="noopener">美国国务院历史办公室：危机概述</a></p><p><a href="https://www.archives.gov/research/alic/reference/military/cuban-missile-crisis.html" target="_blank" rel="noopener">美国国家档案馆：资料入口</a></p><p class="muted">当前资料基础偏重美国档案，尚不足以声称完整再现苏联和古巴决策。下一版须补充相应原始材料。</p></section><section class="panel"><h2>透明结算规则</h2><p>内部记录四项非现实指数：压力、沟通、核实、克制。初始均为0，每个选项有固定增减，最低为0；可在导出记录中查看。</p><p>压力≥9且克制&lt;5：升级失控危险突出。</p><p>否则，沟通≥5、核实≥5且克制≥4：形成可继续落实的降级安排。</p><p>否则，沟通≥3：暂时缓和；其余：僵局。</p><p>这是设计者设定的机制演示。运行结果不能作为“沟通必然带来和平”的独立证据。</p><h3>使用说明</h3><p>每节点只能作一次决定，读完反馈后进入下一节点。进度只存于当前浏览器，可在档案页导出或重开。</p></section></div>`;

function bind(){const by=id=>document.getElementById(id);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>act(+b.dataset.choice));if(by('next'))by('next').onclick=next;['to-council','back-room','resume'].forEach(id=>{if(by(id))by(id).onclick=()=>nav(id==='to-council'?'council':'room')});if(by('consult'))by('consult').onclick=()=>{const a=by('advisor').value;const text={diplomacy:`先区分对方的公开表态与可谈判条件。${s.channel<3?'目前澄清渠道不足，建议先确认消息能否送达。':'已有沟通空间，但不要把收到消息等同于接受条件。'}`,intel:`${s.clarity<3?'现有判断仍有未核实部分。':'我们进行了部分交叉核实，但仍无法读出对手意图。'}历史学家后来掌握的信息，不属于你此刻自动拥有的情报。`,security:`${s.pressure>=4?'压力正在累积，请检查执行机构的授权边界。':'你仍有比较多种政策路径的空间。'}任何扩大授权都需要考虑通信延迟与行动能否撤回。`,cuba:'请把古巴视为具有自身安全诉求的决策主体。美苏之间形成安排，并不自动说明古巴接受了全部执行条件。'}[a];s.advice=text;s.dialogue.push({node:s.step+1,advisor:a,text});render()};if(by('reset'))by('reset').onclick=()=>{if(confirm('清除本浏览器当前进度并重新开始？')){s=fresh();render()}};if(by('export'))by('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:'0.1',mode:'rule-based-counterfactual',...s},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='十三日-决策记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));render();
})();
